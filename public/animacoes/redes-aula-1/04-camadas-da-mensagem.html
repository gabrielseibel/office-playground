<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A viagem de uma mensagem pelas camadas</title>
<link rel="stylesheet" href="_base.css"><script src="vendor/gsap.min.js"></script><script src="_base.js"></script></head><body><script>
V.init({title:"A viagem de uma mensagem pelas camadas"});const C=V.C,tl=V.tl;
const LX=340,RX=940,BO=235,RY=[175,260,345,430],CY=525;
const NOMES=[["Aplicação","navegador, e-mail (HTTP)",C.laranja],["Transporte","TCP e UDP",C.azul],["Internet","IP e roteador",C.verde],["Acesso à rede","cabo e placa de rede",C.azulE]];
const stk=[[],[]];
[LX,RX].forEach((x,si)=>{NOMES.forEach((n,i)=>{const g=V.g(V.s,x,RY[i]);V.el("rect",{x:-165,y:-33,width:330,height:66,rx:12,fill:n[2],"fill-opacity":.9,stroke:"#0b1626","stroke-width":3},g);
  V.text(g,n[0],0,-3,{s:25,w:800});V.text(g,n[1],0,22,{s:16,w:400,c:"#e6eef8"});gsap.set(g,{opacity:0});tl.to(g,{opacity:1,duration:.4},1+i*.25+si*.1);stk[si].push(g);});});
const nomeL=V.text(V.s,"Computador da recepção",LX,115,{s:24,c:"#9fb6d0"}),nomeR=V.text(V.s,"Servidor da clínica",RX,115,{s:24,c:"#9fb6d0"});gsap.set([nomeL,nomeR],{opacity:0});tl.to([nomeL,nomeR],{opacity:1,duration:.4},.8);
/* cabo e roteador */
const cab=V.el("path",{d:`M${LX-BO} ${RY[3]+40}V${CY}H${RX+BO}V${RY[3]+40}`,fill:"none",stroke:C.azulC,"stroke-width":7,"stroke-linejoin":"round"},V.s);
const Lc=(CY-RY[3]-40)*2+(RX-LX+2*BO);gsap.set(cab,{strokeDasharray:Lc,strokeDashoffset:Lc});tl.to(cab,{strokeDashoffset:0,duration:1.2,ease:"power1.inOut"},1.8);
const rot=V.node(V.s,"Roteador",640,CY,{c:C.verde,w:130,h:40,s:19});gsap.set(rot,{opacity:0});V.pop(rot,2.6,.4);
V.title("A viagem de uma mensagem","Da recepção até o servidor da clínica",.2,4.2);
V.cap("Uma mensagem sai do computador da recepção para o servidor. No caminho, ela atravessa as camadas do TCP/IP.",.4,5.6);
/* mensagem em camadas */
const M=V.g(V.s,LX-BO,RY[0]);
const cam=[["#8a97ab",94,152],[C.verde,76,134],[C.azul,58,116],[C.amarelo,40,98]]; // do maior ao menor
const outl=[];
cam.forEach((c,i)=>{const r=V.el("rect",{x:-c[2]/2,y:-c[1]/2,width:c[2],height:c[1],rx:8,fill:i===3?C.amarelo:"#0d2240",stroke:c[0],"stroke-width":5},M);outl.push(r);});
V.text(M,"Arquivo",0,6,{s:19,c:"#2a1f00",w:800});
gsap.set(outl.slice(0,3),{opacity:0});gsap.set(M,{opacity:0});
const chipPos=(g,txt,x,y,t,hold,cor)=>{const c=V.chip(V.s,txt,x,y,{c:"#0d2240",b:cor,s:19,w:txt.length*10.5+30});gsap.set(c,{opacity:0});tl.to(c,{opacity:1,duration:.35},t).to(c,{opacity:0,duration:.3},t+hold);return c;};
tl.to(M,{opacity:1,duration:.4},5.6);
V.cap("Aplicação: o programa cria a mensagem. Pode ser um arquivo, uma página ou um e-mail.",5.4,5);
/* desce */
tl.to(M,{y:RY[1],duration:.9},10.6);tl.to(outl[2],{opacity:1,duration:.4},11.3);
chipPos(M,"TCP numera os pedaços",LX+330,RY[1],11,4.6,C.azul);
V.cap("Transporte: o TCP divide em pedaços, numera e confere se tudo chega.",10.6,5);
tl.to(M,{y:RY[2],duration:.9},15.8);tl.to(outl[1],{opacity:1,duration:.4},16.5);
chipPos(M,"IP põe origem e destino",LX+330,RY[2],16.2,4.6,C.verde);
V.cap("Internet: o IP coloca o endereço de quem envia e o de quem recebe.",15.8,5);
tl.to(M,{y:RY[3],duration:.9},21);tl.to(outl[0],{opacity:1,duration:.4},21.7);
chipPos(M,"placa de rede liga ao cabo",LX+330,RY[3],21.4,4.6,"#8a97ab");
V.cap("Acesso à rede: a placa de rede transforma tudo em sinal e entrega ao cabo.",21,5);
/* viaja */
const t1=26.4;tl.to(M,{y:CY,duration:.7},t1);tl.to(M,{x:640,duration:1.6,ease:"none"},t1+.7);
V.pulse(rot,t1+2.3,1,1.25);
chipPos(M,"o roteador lê o IP de destino",640,CY-65,t1+2.2,2.4,C.verde);
tl.to(M,{x:RX+BO,duration:1.6,ease:"none"},t1+3.6);tl.to(M,{y:RY[3],duration:.7},t1+5.2);
V.cap("A mensagem viaja pelo cabo. O roteador olha o IP de destino e manda para o lado certo.",t1,5.8);
/* sobe */
const t2=33;
V.cap("No servidor, o caminho inverso: cada camada confere e tira o seu envelope.",t2,5.2);
tl.to(outl[0],{opacity:0,duration:.4},t2+.3);chipPos(M,"confere o sinal",RX-330,RY[3],t2,3,"#8a97ab");
tl.to(M,{y:RY[2],duration:.8},t2+3);tl.to(outl[1],{opacity:0,duration:.4},t2+3.6);chipPos(M,"confere o endereço",RX-330,RY[2],t2+3.2,3,C.verde);
tl.to(M,{y:RY[1],duration:.8},t2+6.2);tl.to(outl[2],{opacity:0,duration:.4},t2+6.8);chipPos(M,"junta os pedaços",RX-330,RY[1],t2+6.4,3,C.azul);
tl.to(M,{y:RY[0],duration:.8},t2+9.4);
const ok=V.chip(V.s,"Arquivo recebido",RX-330,RY[0],{c:"#123a25",b:C.verde,s:20});gsap.set(ok,{opacity:0});tl.to(ok,{opacity:1,duration:.4},t2+10.2).to(ok,{opacity:0,duration:.3},t2+13);
/* TCP x UDP */
const t3=47.5;
const rec=V.dot(V.s,RX,RY[0],{c:C.verde,r:15});gsap.set(rec,{opacity:0});
const recT=V.chip(V.s,"TCP: recebi",RX,RY[0]-52,{c:"#123a25",b:C.verde,s:20});gsap.set(recT,{opacity:0});
tl.to(recT,{opacity:1,duration:.3},t3);tl.set(rec,{opacity:1,x:RX,y:RY[0]},t3);
tl.to(rec,{x:LX,duration:1.4,ease:"none"},t3+.2).to([rec,recT],{opacity:0,duration:.3},t3+1.7);
V.cap("TCP confirma: o destino avisa que recebeu e, se faltar pedaço, o pedaço é enviado de novo. Serve para arquivos e e-mail.",t3-.2,6);
const t4=54.5;
const vid=[0,1,2,3].map(i=>V.dot(V.s,0,0,{c:C.laranja,r:12}));vid.forEach(d=>gsap.set(d,{opacity:0}));
vid.forEach((d,i)=>{const e=V.travel(d,[[LX+60,RY[0]],[RX-60,RY[0]]],t4+i*.55,380);if(i===2)tl.to(d,{opacity:0,duration:.2},t4+i*.55+1.5);});
const xx=V.cross(V.s,640,RY[0],20);gsap.set(xx,{opacity:0});tl.to(xx,{opacity:1,duration:.2},t4+1.1+1.5).to(xx,{opacity:0,duration:.3},t4+3.8);
const udp=V.chip(V.s,"UDP: perdeu um, segue sem reenviar",640,RY[0]-50,{c:"#3b2a10",b:C.amarelo,s:20});gsap.set(udp,{opacity:0});tl.to(udp,{opacity:1,duration:.3},t4+.6).to(udp,{opacity:0,duration:.3},t4+5);
V.cap("UDP manda rápido e não confere. Serve para chamada de vídeo e jogo, onde o atraso atrapalha mais do que perder um pedacinho.",t4-.2,6.5);
V.finish();
</script></body></html>
