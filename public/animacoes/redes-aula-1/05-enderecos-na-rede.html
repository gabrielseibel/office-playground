<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Endereços na rede: IP, máscara, gateway e DNS</title>
<link rel="stylesheet" href="_base.css"><script src="vendor/gsap.min.js"></script><script src="_base.js"></script></head><body><script>
V.init({title:"Endereços na rede: IP, máscara, gateway e DNS"});const C=V.C,tl=V.tl;
function box(g,txt,x,y,w,h,col,s){const b=V.g(g,x,y);V.el("rect",{x:-w/2,y:-h/2,width:w,height:h,rx:14,fill:col,stroke:"#0b1626","stroke-width":4},b);V.text(b,txt,0,(s||44)*0.35,{s:s||44,w:800});return b;}
function bracket(g,x1,x2,y,col){return V.el("path",{d:`M${x1} ${y}v14h${x2-x1}v-14`,fill:"none",stroke:col,"stroke-width":5,"stroke-linecap":"round","stroke-linejoin":"round"},g);}
/* ---------- Cena A: DHCP ---------- */
const A=V.g(V.s,0,0),tA=0.4,dA=14.6;V.scene(A,tA,dA);
V.title("Como o computador ganha um endereço?","DHCP e IP",tA,3.4);
const rot=V.node(A,"Roteador",230,350,{c:C.verde,w:190,h:64});V.text(A,"servidor DHCP",230,410,{s:20,c:"#cfe0f2",w:500});
const pcN=V.pc(A,"Computador novo",1010,330,{w:130,h:88});
V.cap("Um computador novo liga na rede. Ele ainda não tem endereço nenhum.",tA+.6,3.6);
const rq=V.chip(A,"Tem IP para mim?",0,0,{w:230,c:C.laranja,b:"#fff"});gsap.set(rq,{opacity:0});
V.ring(A,1010,330,tA+4.4,C.amarelo,170);
V.tl.set(rq,{opacity:1,x:900,y:250},tA+4.4);V.tl.to(rq,{x:420,duration:2,ease:"none"},tA+4.4);V.tl.to(rq,{opacity:0,duration:.3},tA+6.4);
V.cap("Ele grita para toda a rede: tem endereço para mim? É o pedido DHCP.",tA+4,3.8);
const rp=V.chip(A,"Use 192.168.10.100",0,0,{w:290,c:C.verde,b:"#fff"});gsap.set(rp,{opacity:0});
V.tl.set(rp,{opacity:1,x:420,y:290},tA+7.2);V.tl.to(rp,{x:880,duration:2,ease:"none"},tA+7.2);V.tl.to(rp,{opacity:0,duration:.3},tA+9.2);
V.cap("O roteador escolhe um número livre e entrega: use o 192.168.10.100.",tA+7,3.8);
const badge=V.chip(A,"IP: 192.168.10.100",1010,215,{w:290,s:24,c:C.azul,b:"#fff",h:48});gsap.set(badge,{opacity:0});V.pop(badge,tA+9.4);
V.cap("Pronto. O computador tem um IP e já faz parte da rede.",tA+10.2,4);
/* ---------- Cena B: anatomia do IP ---------- */
const B=V.g(V.s,0,0),tB=15.4,dB=16;V.scene(B,tB,dB);
V.title("Por dentro do endereço IP","quatro números separados por pontos",tB,3.4);
const xs=[330,500,670,840],vals=["192","168","10","100"],cols=[C.azul,C.azul,C.azul,C.laranja];
const bx=vals.map((v,i)=>{const b=box(B,v,xs[i],250,130,110,cols[i],52);gsap.set(b,{opacity:0});V.pop(b,tB+1+i*.35);if(i<3)V.text(B,".",(xs[i]+xs[i+1])/2,285,{s:60,w:800});return b;});
const br1=bracket(B,xs[0]-65,xs[2]+65,330,C.azulC),br2=bracket(B,xs[3]-65,xs[3]+65,330,C.laranja);
[br1,br2].forEach(b=>gsap.set(b,{opacity:0}));
const t1=V.text(B,"Rede: o bairro",(xs[0]+xs[2])/2,382,{s:26,c:C.azulC,w:700}),t2=V.text(B,"Computador: a casa",xs[3],382,{s:26,c:C.laranja,w:700});
[t1,t2].forEach(t=>gsap.set(t,{opacity:0}));
tl.to([br1,t1],{opacity:1,duration:.5},tB+4);tl.to([br2,t2],{opacity:1,duration:.5},tB+6);
V.cap("O IP tem duas partes. Os três primeiros números dizem em qual rede o computador está. O último diz qual é ele.",tB+3.6,5.6);
const mk=[255,255,255,0].map((v,i)=>{const b=box(B,String(v),xs[i],510,130,70,i<3?C.azulE:"#7a4a1c",34);gsap.set(b,{opacity:0});tl.to(b,{opacity:1,duration:.4},tB+10+i*.25);return b;});
const mlab=V.text(B,"Máscara",96,520,{s:28,c:"#9fb6d0",w:700,a:"start"});gsap.set(mlab,{opacity:0});tl.to(mlab,{opacity:1,duration:.4},tB+10);
V.cap("A máscara 255.255.255.0 marca onde acaba a parte da rede. O 255 trava o número, o 0 deixa livre.",tB+9.6,6);
/* ---------- Cena C: gateway ---------- */
const Cc=V.g(V.s,0,0),tC=31.8,dC=16;V.scene(Cc,tC,dC);
V.title("Falar com vizinho e falar com o mundo","gateway: a porta de saída",tC,3.4);
V.el("rect",{x:60,y:130,width:620,height:400,rx:26,fill:C.azul,"fill-opacity":.12,stroke:C.azul,"stroke-width":4,"stroke-dasharray":"14 10"},Cc);
V.text(Cc,"Rede 192.168.10.0",370,170,{s:24,c:C.azulC,w:700});
const pa=V.pc(Cc,".100",160,330,{w:96,h:64,s:22}),pb=V.pc(Cc,".101",160,470,{w:96,h:64,s:22}),gw=V.node(Cc,"Roteador .1",520,400,{c:C.verde,w:170,h:56,s:22});
V.line(Cc,160,330,520,400,{c:C.azulC,w:4,op:.5});V.line(Cc,160,470,520,400,{c:C.azulC,w:4,op:.5});V.line(Cc,160,330,160,470,{c:C.azulC,w:4,op:.5});
V.line(Cc,605,400,880,330,{c:C.roxo,w:5});
const nuv=V.g(Cc,1000,320);V.el("ellipse",{rx:150,ry:95,fill:C.roxo,"fill-opacity":.25,stroke:C.roxo,"stroke-width":5},nuv);V.text(nuv,"Internet",0,10,{s:34,w:800});
const p1=V.dot(Cc,0,0,{c:C.amarelo}),p2=V.dot(Cc,0,0,{c:C.laranja});gsap.set([p1,p2],{opacity:0});
V.travel(p1,[[190,335],[190,455]],tC+4.2,150);
V.cap("Para falar com o vizinho da mesma rede, o computador entrega direto. Não precisa de ninguém no meio.",tC+3.6,5.6);
V.travel(p2,[[200,325],[520,395],[880,330],[1000,320]],tC+9.6,330);
V.cap("Para falar com quem está fora, ele entrega ao gateway, que é o roteador. O .1 é a porta de saída da rede.",tC+9.2,6.4);
tl.to([p1],{opacity:0,duration:.3},tC+6);
/* ---------- Cena D: DNS ---------- */
const D=V.g(V.s,0,0),tD=48.2,dD=14;V.scene(D,tD,dD);
V.title("Quem traduz o nome em número?","DNS",tD,3.2);
V.pc(D,"Seu computador",170,360,{w:120,h:80});
const dns=V.node(D,"DNS",640,360,{c:C.roxo,w:150,h:60,s:26});V.text(D,"a lista telefônica da internet",640,422,{s:19,c:"#cfe0f2",w:500});
const srv=V.g(D,1100,360);V.el("rect",{x:-60,y:-75,width:120,height:150,rx:12,fill:C.cinza,stroke:"#0b1626","stroke-width":4},srv);for(let k=0;k<3;k++)V.el("rect",{x:-44,y:-58+k*44,width:88,height:30,rx:6,fill:"#0d2744"},srv);V.text(srv,"Servidor do site",0,118,{s:20,w:600});
const q=V.chip(D,"www.senac.br",0,0,{w:200,c:C.laranja,b:"#fff"}),r=V.chip(D,"203.0.113.25",0,0,{w:200,c:C.verde,b:"#fff"}),sendp=V.dot(D,0,0,{c:C.amarelo});gsap.set([q,r,sendp],{opacity:0});
V.travel(q,[[240,300],[560,300]],tD+3.2,200);tl.to(q,{opacity:0,duration:.3},tD+4.9);
V.cap("Você digita um nome fácil: www.senac.br. O computador pergunta ao DNS.",tD+3,4);
V.travel(r,[[560,300],[240,300]],tD+7,200);tl.to(r,{opacity:0,duration:.3},tD+8.6);
V.cap("O DNS responde com o número do servidor: 203.0.113.25.",tD+6.8,3.6);
V.travel(sendp,[[240,360],[1000,360]],tD+10.2,330);
V.cap("Agora sim: o computador vai ao servidor pelo número. Sem DNS, só abriria sites decorando números.",tD+9.8,4);
/* ---------- Cena E: IPv4 x IPv6 ---------- */
const E=V.g(V.s,0,0),tE=62.6,dE=12;V.scene(E,tE,dE);
V.title("Dois tamanhos de endereço","IPv4 e IPv6",tE,3);
const b4=V.g(E,0,0),b6=V.g(E,0,0);
V.el("rect",{x:100,y:150,width:520,height:330,rx:20,fill:C.azul,"fill-opacity":.2,stroke:C.azul,"stroke-width":4},b4);
V.text(b4,"IPv4",360,205,{s:40,w:800});V.text(b4,"192.168.10.100",360,285,{s:34,w:700,c:C.azulC});V.text(b4,"4 números, 32 bits",360,345,{s:24,w:500,c:"#cfe0f2"});V.text(b4,"cerca de 4,3 bilhões",360,420,{s:28,w:800,c:C.amarelo});
V.el("rect",{x:660,y:150,width:520,height:330,rx:20,fill:C.roxo,"fill-opacity":.2,stroke:C.roxo,"stroke-width":4},b6);
V.text(b6,"IPv6",920,205,{s:40,w:800});V.text(b6,"2001:db8::1a2b:3c4d",920,285,{s:32,w:700,c:"#cdb8f5"});V.text(b6,"letras e números, 128 bits",920,345,{s:24,w:500,c:"#cfe0f2"});V.text(b6,"340 undecilhões",920,420,{s:28,w:800,c:C.amarelo});
gsap.set([b4,b6],{opacity:0});tl.to(b4,{opacity:1,duration:.5},tE+1.2);tl.to(b6,{opacity:1,duration:.5},tE+5.6);
V.cap("O IPv4 é o formato que usamos hoje. Ele tem cerca de 4,3 bilhões de endereços, e já está acabando.",tE+1,4.4);
V.cap("O IPv6 é o sucessor. Com 340 undecilhões de endereços, dá para dar um a cada grão de areia.",tE+5.4,5.4);
V.finish();
</script></body></html>
