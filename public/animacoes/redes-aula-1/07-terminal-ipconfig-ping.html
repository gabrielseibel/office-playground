<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terminal: ipconfig e ping</title>
<link rel="stylesheet" href="_base.css"><script src="vendor/gsap.min.js"></script><script src="_base.js"></script></head><body><script>
V.init({title:"Terminal: ipconfig e ping"});const C=V.C,tl=V.tl;
const MONO='"Consolas","Liberation Mono","Courier New",monospace';
function term(g,x,y,w,h,title){V.el("rect",{x:x,y:y,width:w,height:h,rx:14,fill:"#0a0f18",stroke:C.azulC,"stroke-width":3},g);V.el("rect",{x:x,y:y,width:w,height:38,rx:14,fill:"#1b2a40"},g);V.el("rect",{x:x,y:y+24,width:w,height:14,fill:"#1b2a40"},g);V.text(g,title,x+18,y+26,{a:"start",s:18,w:600,c:"#cfe0f2"});}
/* linha de terminal que "digita" ou aparece */
function line(g,txt,x,y,t,o){o=o||{};const e=V.text(g,"",x,y,{a:"start",s:o.s||21,w:400,c:o.c||"#d8e4f0",f:MONO});const n={v:0},L=txt.length,d=o.type?L*.09:.25;
  tl.to(n,{v:L,duration:d,ease:"none",onUpdate:()=>{e.textContent=txt.slice(0,Math.round(n.v));}},t);return {e:e,end:t+d};}
function hl(g,x,y,w,h,col,t){const r=V.el("rect",{x:x,y:y,width:w,height:h,rx:6,fill:col,"fill-opacity":.28,stroke:col,"stroke-width":3,opacity:0},g);tl.to(r,{opacity:1,duration:.4},t);return r;}
/* ---------- A: ipconfig ---------- */
const A=V.g(V.s,0,0),tA=.4,dA=22;V.scene(A,tA,dA);
V.title("Descobrindo o IP pelo terminal","comando ipconfig",tA,3.4);

let t=tA+1;
let r=line(A,"C:\\Users\\aluno> ipconfig",84,175,t,{type:true});t=r.end+.5;
V.cap("No prompt de comando, digite ipconfig e aperte Enter.",tA+.8,4);
const rows=[["Adaptador Ethernet:",null],["   Endereço IPv4 . . . . . . : 192.168.10.100","ip"],["   Máscara de Sub-rede . . . : 255.255.255.0","mask"],["   Gateway Padrão  . . . . . : 192.168.10.1","gw"]];
const ys={ip:262,mask:300,gw:338};const rowT={};
rows.forEach((rw,i)=>{const y=224+i*38;line(A,rw[0],84,y,t+i*.7);if(rw[1])rowT[rw[1]]=t+i*.7+.4;});
const sideX=880;

cards.forEach((c,i)=>{const yy=150+i*120;const g=V.g(A,0,0);V.el("rect",{x:sideX,y:yy,width:340,height:96,rx:14,fill:c[3],"fill-opacity":.2,stroke:c[3],"stroke-width":3},g);V.text(g,c[1],sideX+20,yy+38,{a:"start",s:26,w:800,c:c[3]});V.text(g,c[2],sideX+20,yy+72,{a:"start",s:20,w:500,c:"#cfe0f2"});gsap.set(g,{opacity:0});
  const tt=t+3.6+i*3;tl.to(g,{opacity:1,duration:.5},tt);hl(A,78,c[4]-26,720,34,c[3],tt);});
V.cap("O ipconfig mostra três informações essenciais: o IP, a máscara e o gateway.",t+3.4,9.4);
V.cap("Anote o gateway. Ele será o primeiro alvo do ping.",t+13,4);
/* ---------- B: ping ---------- */
const B=V.g(V.s,0,0),tB=23.6,dB=26;V.scene(B,tB,dB);
V.title("Testando a conexão","comando ping",tB,3.2);
term(B,60,110,780,455,"Prompt de Comando");
let u=tB+1;
r=line(B,"C:\\Users\\aluno> ping 192.168.10.1",84,175,u,{type:true});u=r.end+.4;
V.cap("O ping manda 4 mensagens pequenas a um endereço e espera a resposta.",tB+.8,4.4);
for(let i=0;i<4;i++){line(B,"Resposta de 192.168.10.1: bytes=32 tempo<1ms",84,213+i*34,u+i*.7,{s:20,c:"#7fe0a8"});}
line(B,"Pacotes: Enviados = 4, Recebidos = 4, Perdidos = 0",84,365,u+3.2,{s:20});

const g1=V.g(B,0,0);V.el("rect",{x:880,y:150,width:340,height:110,rx:14,fill:C.verde,"fill-opacity":.2,stroke:C.verde,"stroke-width":3},g1);V.text(g1,"Respondeu",sideX+20,190,{a:"start",s:28,w:800,c:C.verde});V.text(g1,"o gateway está vivo",sideX+20,228,{a:"start",s:21,c:"#cfe0f2"});gsap.set(g1,{opacity:0});tl.to(g1,{opacity:1,duration:.5},u+3.6);
V.cap("Recebidos = 4 e Perdidos = 0: o gateway respondeu. O cabo e a placa estão bem.",u+3.4,6);
let w=tB+14;
r=line(B,"C:\\Users\\aluno> ping 192.168.10.250",84,432,w,{type:true});w=r.end+.4;
V.cap("Agora um endereço que ninguém está usando.",tB+13.6,3.4);
for(let i=0;i<2;i++){line(B,"Esgotado o tempo limite do pedido.",84,470+i*34,w+i*.9,{s:20,c:"#ff8c8c"});}
line(B,"Pacotes: Enviados = 4, Recebidos = 0, Perdidos = 4",84,545,w+2.2,{s:20});
hl(B,78,519,720,34,C.verm,w+2.4);
const g2=V.g(B,0,0);V.el("rect",{x:880,y:300,width:340,height:110,rx:14,fill:C.verm,"fill-opacity":.2,stroke:C.verm,"stroke-width":3},g2);V.text(g2,"Sem resposta",sideX+20,340,{a:"start",s:28,w:800,c:C.verm});V.text(g2,"cabo, IP ou aparelho com defeito",sideX+20,378,{a:"start",s:19,c:"#cfe0f2"});gsap.set(g2,{opacity:0});tl.to(g2,{opacity:1,duration:.5},w+2.4);

const D=V.g(V.s,0,0),tD=50.4,dD=22;V.scene(D,tD,dD);
V.title("A escada do diagnóstico","do mais perto para o mais longe",tD,3.4);
const steps=[["1","ipconfig","Tenho IP, máscara e gateway?",C.laranja,"Sem IP: confira cabo e DHCP"],["2","ping 127.0.0.1","A placa de rede funciona?",C.azul,"Sem resposta: placa ou driver"],["3","ping do gateway","Chego ao roteador?",C.verde,"Sem resposta: cabo ou roteador"],["4","ping 8.8.8.8","Chego à internet?",C.roxo,"Sem resposta: problema do provedor"],["5","ping de um nome","O DNS traduz?",C.amarelo,"Só o nome falha: problema de DNS"]];
steps.forEach((s,i)=>{const y=150+i*86,g=V.g(D,0,0);V.el("rect",{x:110,y:y-32,width:1060,height:72,rx:14,fill:s[3],"fill-opacity":.2,stroke:s[3],"stroke-width":3},g);
  const cc=V.el("circle",{cx:160,cy:y+4,r:26,fill:s[3],stroke:"#0b1626","stroke-width":3},g);V.text(g,s[0],160,y+14,{s:30,w:800,c:"#0b1626"});
  V.text(g,s[1],215,y+13,{a:"start",s:25,w:800,f:MONO});V.text(g,s[2],500,y+12,{a:"start",s:22,w:500,c:"#cfe0f2"});V.text(g,s[4],1155,y+12,{a:"end",s:19,w:600,c:s[3]});
  gsap.set(g,{opacity:0});tl.to(g,{opacity:1,x:0,startAt:{x:-50},duration:.5},tD+1+i*2.6);});
V.cap("Teste de perto para longe. O primeiro degrau que falhar mostra onde está o problema.",tD+.8,8);
V.cap("Cabo, placa, roteador, provedor, DNS: cada degrau separa uma causa.",tD+14,7);
V.finish();
</script></body></html>
