<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O chamado da Clínica Bem Viver</title>
<link rel="stylesheet" href="_base.css"><script src="vendor/gsap.min.js"></script><script src="_base.js"></script></head><body><script>
V.init({title:"O chamado da Clínica Bem Viver"});const C=V.C,tl=V.tl;
/* prédio */
const plan=V.el("g",{});
const walls=[[110,130,1170,130],[1170,130,1170,550],[1170,550,110,550],[110,550,110,130],[520,130,520,550],[800,130,800,550],[110,340,1170,340]];
walls.forEach((w,i)=>{const l=V.line(plan,w[0],w[1],w[2],w[3],{c:"#4d6a8f",w:6});V.drawIn(l,.4+i*.12,.6,w[0],w[1],w[2],w[3]);});
const rooms=[["Recepção",130,162],["Consultório",540,162],["Financeiro",820,162],["Sala de apoio",130,372],["Sala técnica",540,372],["Corredor",820,372]];
const rl=rooms.map(r=>{const t=V.text(plan,r[0],r[1],r[2],{a:"start",s:21,w:700,c:"#9fb6d0"});gsap.set(t,{opacity:0});return t;});
tl.to(rl,{opacity:1,duration:.4,stagger:.1},1.2);
/* aparelhos */
const dev=V.el("g",{});
const P=[["Posto 1",230,225],["Posto 2",420,225],["Posto 3",660,225],["Posto 4",985,225],["Posto 5",320,450]];
const pcs=P.map(p=>V.pc(dev,p[0],p[1],p[2],{w:84,h:56,s:18}));
const imp=V.pc(dev,"Impressora",170,300,{w:70,h:44,c:C.cinza,s:16});
const sw=V.node(dev,"Ponto central",660,415,{w:150,h:44,s:17});
const rot=V.node(dev,"Roteador",575,500,{c:C.verde,w:110,h:40,s:16});
const srv=V.pc(dev,"Servidor",760,490,{w:70,h:44,s:16});
const todos=[...pcs,imp,sw,rot,srv];gsap.set(todos,{opacity:0});
todos.forEach((g,i)=>V.pop(g,4.8+i*.45,.4));
/* título e legendas */
V.title("Chamado: Clínica Bem Viver","Equipe técnica da Conecta Sul",.2,4.2);
V.cap("A Clínica Bem Viver, de Lajeado, mudou para uma sede nova.",.4,4);
V.cap("São 5 postos de trabalho, uma impressora e um servidor de arquivos.",4.6,7.2);
/* problema: pen drive */
const pen=V.g(V.s,0,0);V.el("rect",{x:-17,y:-9,width:34,height:18,rx:3,fill:C.amarelo,stroke:"#0b1626","stroke-width":3},pen);V.el("rect",{x:17,y:-5,width:9,height:10,fill:C.cinzaC},pen);gsap.set(pen,{opacity:0});
const penL=V.chip(pen,"pen drive",0,-38,{c:"#5a4510",b:C.amarelo,s:18});
const x1=V.cross(V.s,170,300,20);gsap.set(x1,{opacity:0});
const ilha=V.text(V.s,"Cada computador é uma ilha",640,600,{s:26,c:C.amarelo});gsap.set(ilha,{opacity:0});
tl.set(pen,{x:230,y:225,opacity:1},12.2);
V.travel(pen,[[230,225],[330,260],[520,260],[660,225]],12.4,150);
tl.to(pen,{opacity:0,duration:.3},17.4);
tl.to(x1,{opacity:1,duration:.3},15.5).to(ilha,{opacity:1,duration:.4},17.6);
V.cap("Sem rede, cada computador é uma ilha: o arquivo vai de pen drive e a impressora atende só quem está perto.",12.2,8.8);
/* solução: links */
tl.to([ilha,x1],{opacity:0,duration:.4},21.2);
const links=[];
const cx=660,cy=415;
const alvo=[[230,225,26],[420,225,26],[660,225,26],[985,225,26],[320,450,34],[170,300,30],[575,500,22],[760,490,22]];
const ln=V.el("g",{});gsap.set(ln,{opacity:1});
alvo.forEach((a,i)=>{const l=V.line(ln,cx,cy,a[0],a[1]+ (a[1]<cy? a[2]:-a[2]*0.4),{c:C.azulC,w:5});links.push(l);V.drawIn(l,21.6+i*.35,.55,cx,cy,a[0],a[1]);});
/* internet */
const nuvem=V.g(V.s,985,450);V.el("ellipse",{cx:0,cy:0,rx:80,ry:38,fill:C.azulE,stroke:C.azulC,"stroke-width":3},nuvem);V.text(nuvem,"Internet",0,7,{s:22});gsap.set(nuvem,{opacity:0});
const lNet=V.line(V.s,575,500,905,460,{c:C.verde,w:5});V.drawIn(lNet,24.9,.8,575,500,905,460);
V.pop(nuvem,25.2,.5);
/* pacotes em fluxo */
const pk=[0,1,2].map(i=>V.dot(V.s,0,0,{c:[C.amarelo,C.verde,C.laranja][i],r:11}));pk.forEach(p=>gsap.set(p,{opacity:0}));
V.travel(pk[0],[[230,225],[660,415],[985,225]],25.6,380);
V.travel(pk[1],[[320,450],[660,415],[170,300]],26.4,380);
V.travel(pk[2],[[420,225],[660,415],[575,500],[905,460]],27.2,380);
V.cap("A equipe planeja a rede: quem se liga com quem, por qual meio e com qual endereço.",21.4,9.4);
/* missão */
tl.to([plan,dev,ln,lNet,nuvem,...pk],{opacity:.18,duration:.6},31.2);
const mis=V.g(V.s,640,360);
V.el("rect",{x:-400,y:-190,width:800,height:360,rx:22,fill:"#0d2240",stroke:C.laranja,"stroke-width":4},mis);
V.text(mis,"Missão da turma",0,-135,{s:34,c:C.laranja});
const itens=["Tipo de rede e meio de comunicação","Topologia, com o motivo da escolha","Endereço IP de cada aparelho","Mapa documentado e organizado"];
const marks=[];
itens.forEach((t,i)=>{const y=-70+i*58;const box=V.el("rect",{x:-340,y:y-22,width:36,height:36,rx:8,fill:"none",stroke:C.azulC,"stroke-width":4},mis);V.text(mis,t,-280,y+7,{a:"start",s:28,w:600});
  const ck=V.el("path",{d:`M-333 ${y-2}L-324 ${y+8}L-309 ${y-12}`,stroke:C.verde,"stroke-width":7,fill:"none","stroke-linecap":"round","stroke-linejoin":"round"},mis);gsap.set(ck,{opacity:0});marks.push(ck);});
gsap.set(mis,{opacity:0});tl.to(mis,{opacity:1,duration:.5},31.6);
marks.forEach((m,i)=>tl.to(m,{opacity:1,scale:1,duration:.3,startAt:{scale:.5}},34.2+i*.7));
V.cap("Hoje a turma monta o mapa dessa rede. Decida, justifique e documente.",31.6,8);
V.finish();
</script></body></html>
